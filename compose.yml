name: opendesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opendesk
      POSTGRES_USER: opendesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendesk"]
      interval: 3s
      retries: 20

  storage:
    # Almacenamiento de adjuntos compatible con S3 (SeaweedFS, Apache-2.0). Sin puertos publicados.
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-opendesk}
    volumes:
      - storage-data:/data

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendesk:${POSTGRES_PASSWORD}@db/opendesk
      DEV_SEED: ${DEV_SEED:-true}
    volumes:
      - ./api:/srv
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  worker:
    # Revisa plazos cada minuto: aviso al 80 % del SLA, auto-escalamiento, recordatorios y compromisos vencidos.
    build: ./api
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendesk:${POSTGRES_PASSWORD}@db/opendesk
    volumes:
      - ./api:/srv
    depends_on:
      - api

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./web:/web
      - web-modules:/web/node_modules
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
  storage-data:
  web-modules:
