# Despliegue: SPA compilada servida por nginx, API sin recarga, solo expuesto en 127.0.0.1.
# Uso: docker compose -f compose.prod.yml up -d --build
name: opendesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opendesk
      POSTGRES_USER: opendesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendesk"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendesk:${POSTGRES_PASSWORD}@db/opendesk
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8087}:80"
    depends_on:
      - api

volumes:
  db-data:
