# Despliegue: SPA compilada servida por nginx, API sin recarga, solo expuesto en 127.0.0.1.
# Uso: docker compose -f compose.prod.yml up -d --build
name: opendesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opendesk
      POSTGRES_USER: opendesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendesk"]
      interval: 3s
      retries: 20

  storage:
    # Almacenamiento de adjuntos compatible con S3 (SeaweedFS, Apache-2.0). Sin puertos publicados.
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-opendesk}
    volumes:
      - storage-data:/data

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m app.core.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendesk:${POSTGRES_PASSWORD}@db/opendesk
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  worker:
    # Revisa plazos cada minuto: aviso al 80 % del SLA, auto-escalamiento, recordatorios y compromisos vencidos.
    build: ./api
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://opendesk:${POSTGRES_PASSWORD}@db/opendesk
    depends_on:
      - api

  backup:
    # Respaldo diario a las 03:00: base de datos y adjuntos en ./backups, 14 días de retención (ops/backup.sh).
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Mexico_City}
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage-data:/storage:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8087}:80"
    depends_on:
      - api

volumes:
  db-data:
  storage-data:
