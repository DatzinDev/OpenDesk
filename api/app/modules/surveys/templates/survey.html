<h1 style="font-size:20px;margin:0 0 16px;">Hola{% if name %}, {{ name }}{% endif %}</h1>
<p style="margin:0 0 20px;">{{ question }}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
  <tr>
    {% for n in range(1, 6) %}
    <td style="padding:0 6px 0 0;">
      <a href="{{ link }}?r={{ n }}" style="display:inline-block;width:44px;height:44px;line-height:44px;text-align:center;border-radius:8px;background:#0b1d3a;color:#ffffff;text-decoration:none;font-weight:600;font-size:17px;">{{ n }}</a>
    </td>
    {% endfor %}
  </tr>
</table>
<p style="margin:0 0 20px;font-size:12px;color:#5b6070;">1 = nada satisfecho, 5 = muy satisfecho</p>
<p style="margin:0;font-size:13px;color:#5b6070;">Folio {{ folio }}. El enlace es personal y vence en {{ days }} días.</p>
